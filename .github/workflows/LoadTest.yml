name: Load Test

on:
  workflow_call:

jobs:

  loadtest:
    runs-on: ubuntu-latest
    environment: CI
    steps:
    - uses: actions/checkout@v3
    - name: configurando credenciais da AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.EC2_USERNAME }}
        aws-secret-access-key: ${{ secrets.EC2_SECRET_KEY }}
        aws-region: us-east-1
    - run: gitclone https://github.com/STUG9000/Infra_CI
    
    - name: HashiCorp - Setup Terraform
      uses: hashicorp/setup-terraform@v2.0.3

    - run: terraform -chdir=Infra_CI/env/Homolog init

    - run: terraform -chdir=Infra_CI/env/Homolog destroy -auto-approve

    - run: terraform -chdir=Infra_CI/env/Homolog apply -auto-approve

    - run: echo "$(terraform -chdir=Infra_CI/env/Homolog output -raw IP_alb)"
            
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: 3.10
    
    - uses: BSFishy/pip-action@v1
      with:
        packages: |
          package1
    
      
      
      
