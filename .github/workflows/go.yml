name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.21']
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}

    - name: Pin Postgres image version for CI
      run: |
        sed -i 's/image: "postgres"/image: "postgres:16"/' docker-compose.yml

    - name: Prepare postgres data dir
      run: sudo mkdir -p /postgres-data && sudo chown -R 999:999 /postgres-data

    - name: Build-DB
      run: docker compose build

    - name: Create-DB
      run: docker compose up -d

    - name: Wait for Postgres
      run: |
        for i in {1..60}; do
          pg_isready -h localhost -p 5432 -U root && exit 0
          sleep 1
        done
        echo "Postgres did not become ready in time"
        docker compose ps
        docker compose logs postgres
        exit 1

    - name: Test
      run: go test -v main_test.go
      
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
      
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: programa
        path: main


  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit
    
  # Deploy_EC2:
    # needs: build
    # uses: ./.github/workflows/EC2.yml
    # secrets: inherit
    
  Deploy_ECS:
     needs: docker
     uses: ./.github/workflows/ECS.yml
     secrets: inherit

  Loadtest:
    needs: docker
    if: ${{ github.ref_name == "Homolog" }}
    uses: ./.github/workflows/LoadTest.yml
    secrets: inherit

  
